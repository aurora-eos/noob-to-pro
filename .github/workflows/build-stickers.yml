name: Build Clawd stickers
on:
  push:
    branches: [clawd-stickers]
    paths:
      - 'render.py'
      - 'requirements.txt'
      - '.github/workflows/build-stickers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 12 animated stickers
        run: |
          python -m pip install -r requirements.txt
          python render.py
      - name: Commit generated GIFs, PNGs and previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gifs png preview
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate pixel-art stickers [skip ci]'
            git push
          fi